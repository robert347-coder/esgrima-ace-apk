# Construye el APK automáticamente en los servidores de GitHub cada vez
# que se suben cambios. El APK aparece en la pestaña "Actions" → la última
# ejecución → "Artifacts" → esgrima-ace-apk.
name: Construir APK

on:
  push:
    branches: [main]
    paths-ignore: ['amazing/**', '.github/workflows/amazing.yml']
  workflow_dispatch:

permissions:
  contents: write   # para publicar el APK en "Releases"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Librería del código QR (para que funcione sin conexión)
        run: mkdir -p www/js/vendor && curl -fsSL -o www/js/vendor/qrcode.min.js https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js
      - name: Instalar Capacitor
        run: npm install
      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF' --splashBackgroundColor '#1B5E20' || echo "Iconos por defecto"
          npx cap sync android
      - name: Compilar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: esgrima-ace-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar el APK en "Releases" (fácil de descargar desde el móvil)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EsgrimaACE-demo.apk
          gh release create "demo-${{ github.run_number }}" EsgrimaACE-demo.apk \
            --title "Esgrima ACE · demo ${{ github.run_number }}" \
            --notes "APK de prueba (modo demo, datos de ejemplo guardados en el móvil). Descarga EsgrimaACE-demo.apk e instálalo." \
            --latest
      - name: Guardar también el APK en la rama "apk"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --cached . -q
          git add -f EsgrimaACE-demo.apk
          git commit -q -m "APK demo ${{ github.run_number }}"
          git push -f origin apk
