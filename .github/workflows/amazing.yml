# Construye las 5 apps de Amazing Fencing:
#  - APK de prueba (debug) para instalar en el móvil
#  - AAB de release para Google Play (sin firmar, o firmado si existen los
#    secretos AF_KEYSTORE_B64, AF_KEYSTORE_PASS y AF_KEY_ALIAS)
# Capacitor 8 · Android 16 (API 36), requisito de Google Play desde el 31-ago-2026.
name: Amazing Fencing (5 apps)

on:
  push:
    branches: [main]
    paths: ['amazing/**', '.github/workflows/amazing.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [entrena, arbitro, entrenador, competicion, peso]
    defaults:
      run:
        working-directory: amazing/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Tipografías dentro de la app (sin conexión)
        run: python3 ../../fuentes_locales.py www
      - run: npm install
      - name: Proyecto Android
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's|</manifest>|    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>|' $M
          grep -q 'permission.VIBRATE' $M || sed -i 's|</manifest>|    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>|' $M
          # Versión: cada compilación sube el número (Google Play lo exige)
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName|targetSdk|compileSdk" android/app/build.gradle android/variables.gradle || true
          npx capacitor-assets generate --android --iconBackgroundColor '#13294B' --splashBackgroundColor '#13294B' || echo "Iconos por defecto"
          npx cap sync android
      - name: Compilar APK de prueba y AAB para Google Play
        env:
          KS_B64: ${{ secrets.AF_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.AF_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.AF_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          FIRMA=""
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/subida.jks"
            FIRMA="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/subida.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=$KS_ALIAS -Pandroid.injected.signing.key.password=$KS_PASS"
          fi
          ./gradlew assembleDebug bundleRelease $FIRMA
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AF-${{ matrix.app }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/AF-${{ matrix.app }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: AF-${{ matrix.app }}
          path: |
            AF-${{ matrix.app }}.apk
            AF-${{ matrix.app }}.aab

  publicar:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la salida
          gh release create "amazing-${{ github.run_number }}" salida/*.apk salida/*.aab \
            --title "Amazing Fencing · 5 apps (${{ github.run_number }})" \
            --notes "APK de prueba para instalar en el móvil y AAB para Google Play. Versión 1.${{ github.run_number }} (versionCode ${{ github.run_number }})." \
            --latest=false
      - name: Guardar también en la rama "apk-amazing"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk-amazing
          git rm -rf --cached . -q
          git add -f salida/*.apk salida/*.aab
          git commit -q -m "Amazing Fencing ${{ github.run_number }}"
          git push -f origin apk-amazing
